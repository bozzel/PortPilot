name: Feature suggestion
description: Propose an improvement to the PortPilot workflow.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe your xLights workflow and where you get stuck.
    validations:
      required: true
  - type: textarea
    id: improvement
    attributes:
      label: What would help?
      description: Describe what you’d like PortPilot to do and add an example if you have one.
    validations:
      required: true
