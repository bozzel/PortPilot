<title>PortPilot</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* PortPilot. Opzet: een patchpaneel. Bovenaan een stappenplan voor de eerste keer; links de props, rechts de kasten als rijen klemmen met belastingsbalken. */
:root{
  --bg:#eef0ee; --panel:#fbfcfa; --ink:#18201d; --muted:#5d6763; --line:#d3d9d5; --soft:#e4e8e5;
  --accent:#0e6a73; --accent-ink:#ffffff; --chip:#e3eceb; --chip-ink:#123c40;
  --ok:#2f8a4c; --yel:#b89a00; --power:#a8730a; --warn:#c77a12; --bad:#c23b2e; --ok-bg:#e2f1e6; --warn-bg:#fbefd9; --bad-bg:#f8e1de;
  --sel:#f2c94c;
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121614; --panel:#1a201d; --ink:#e4ebe7; --muted:#97a39d; --line:#2e3833; --soft:#232b27;
  --accent:#4fb6bf; --accent-ink:#0b1513; --chip:#22393a; --chip-ink:#cfeeee;
  --ok:#5fc27e; --yel:#e6cf3a; --power:#e0b34a; --warn:#e9a443; --bad:#f07466; --ok-bg:#1d3325; --warn-bg:#3a2c14; --bad-bg:#3d1f1b; --sel:#d9b13a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121614; --panel:#1a201d; --ink:#e4ebe7; --muted:#97a39d; --line:#2e3833; --soft:#232b27;
  --accent:#4fb6bf; --accent-ink:#0b1513; --chip:#22393a; --chip-ink:#cfeeee;
  --ok:#5fc27e; --yel:#e6cf3a; --power:#e0b34a; --warn:#e9a443; --bad:#f07466; --ok-bg:#1d3325; --warn-bg:#3a2c14; --bad-bg:#3d1f1b; --sel:#d9b13a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:20px;font-weight:600;letter-spacing:-.01em}
h2{font-size:15px;font-weight:600}
h3{font-size:13px;font-weight:600}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 10px}
button:hover{border-color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.small{padding:2px 7px;font-size:12px}
button.link{border:none;background:none;padding:0;color:var(--accent);text-decoration:underline;font-size:12px}
select,input[type=number],input[type=text],textarea{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 8px}
input[type=number],input[data-live]{width:5.5em}
.top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;justify-content:space-between;margin-bottom:12px}
.top .title{display:flex;flex-direction:column;gap:2px}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cfgbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:12px}
.cfgbar label{font-size:12px;color:var(--muted)}
.save{font-size:12px;color:var(--muted);margin-left:auto}
.layout{display:grid;grid-template-columns:minmax(250px,320px) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;min-width:0}
.panel>header{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px}
.boxes{display:flex;flex-direction:column;gap:14px;min-width:0}
.box .meta{font-size:12px;color:var(--muted)}
.ports{display:flex;flex-direction:column;gap:4px}
.port{display:grid;grid-template-columns:44px minmax(0,1fr) 134px;gap:8px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:5px 6px;background:var(--panel);min-height:40px}
.port.drop{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.port.target{cursor:copy}
.port .num{font-family:var(--f-mono);font-weight:600;font-size:13px;text-align:center;border-radius:4px;padding:3px 0;background:var(--soft)}
.port.lvl-ok .num{background:var(--ok-bg);color:var(--ok)}
.port.lvl-warn .num{background:var(--warn-bg);color:var(--warn)}
.port.lvl-bad .num{background:var(--bad-bg);color:var(--bad)}
.port.rx{background:var(--soft)}
.port .body{display:flex;flex-direction:column;gap:4px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:4px;min-height:22px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--chip);color:var(--chip-ink);border-radius:4px;padding:2px 4px 2px 7px;font-size:12px;max-width:100%;cursor:grab;border:1px solid transparent}
.chip.sel{border-color:var(--sel);box-shadow:0 0 0 2px var(--sel)}
.chip .n{font-family:var(--f-mono);opacity:.8}
.chip .lock{font-size:11px}
.chip button{border:none;background:none;padding:0 3px;font-size:12px;line-height:1;color:inherit;opacity:.7}
.chip button:hover{opacity:1}
.chip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:210px}
.bar{position:relative;height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.meter{display:grid;grid-template-columns:14px minmax(0,1fr);gap:6px;align-items:center}
.meter svg{width:12px;height:12px;color:var(--muted);display:block}
.legend svg{width:11px;height:11px;vertical-align:-1px;margin-right:3px;color:var(--muted)}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.bar b{position:absolute;top:-2px;bottom:-2px;width:1px;background:var(--muted);opacity:.6}
.load{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:12px;text-align:right;line-height:1.25}
.load .px{font-size:13px;font-weight:600}
.pbr{display:inline-flex;align-items:center;gap:2px;font-size:11px;color:var(--muted);margin-top:2px}
.pbr input{width:3.2em;padding:1px 4px;font-size:12px;text-align:right}
.msg{font-size:12px}
.msg.warn{color:var(--warn)} .msg.bad{color:var(--bad)}
.props{display:flex;flex-direction:column;gap:3px;max-height:none}
.prop{border:1px solid var(--line);border-radius:6px;padding:6px 8px;display:flex;flex-direction:column;gap:4px}
.prop.unassigned{border-style:dashed}
.prop .row1{display:flex;gap:6px;align-items:center;justify-content:space-between}
.prop .pn{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;cursor:pointer}
.prop .where{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.prop .detail{display:flex;flex-direction:column;gap:6px;border-top:1px dashed var(--line);padding-top:6px}
.side{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 4px}
.pool{border:1px dashed var(--line);border-radius:6px;padding:8px;min-height:44px;display:flex;flex-wrap:wrap;gap:4px;align-items:flex-start}
.pool.drop{border-color:var(--accent)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px;margin-top:14px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;font-size:12px;color:var(--muted)}
td.r,th.r{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
.issues{display:flex;flex-direction:column;gap:6px}
.issue{border-left:3px solid var(--line);padding:4px 8px;background:var(--soft);border-radius:0 6px 6px 0;font-size:13px}
.issue.warn{border-left-color:var(--warn)} .issue.yel{border-left-color:var(--yel)} .issue.bad{border-left-color:var(--bad)} .issue.info{border-left-color:var(--accent)}
.issue .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.field .inl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.empty{border:2px dashed var(--line);border-radius:10px;padding:28px 18px;text-align:center;color:var(--muted)}
.empty.drop{border-color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:20;max-width:calc(100% - 32px)}
details>summary{cursor:pointer;font-weight:600}
.hint{font-size:12px;color:var(--muted)}
.psuhead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;font-weight:600;color:var(--muted);padding:6px 2px 2px;border-bottom:1px solid var(--line);margin-bottom:2px}
.psuhead:not(:first-child){margin-top:8px}
.selbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sel);color:#1d1600;border-radius:6px;padding:6px 10px;margin-bottom:10px;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.selbar button{background:#fff8dc;border-color:#c9a530;color:#1d1600}
@media (prefers-reduced-motion:no-preference){.port,.chip{transition:border-color .12s,box-shadow .12s}}
.tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.tabs[hidden]{display:none}
.tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;padding:8px 12px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.hw{display:flex;flex-direction:column;gap:14px}
.hwrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:8px 10px;align-items:end;border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.hwrow .field input,.hwrow .field select{width:100%}
.hwrow .field .inl{flex-wrap:nowrap}
.hwrow .field .inl input{width:4.5em;flex:none}
.hwrow .field .inl select{width:auto}
.hwrow .acts{display:flex;gap:6px;align-items:end;justify-content:flex-end}
.tag{font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font-size:22px;letter-spacing:-.02em}
.brand h1 span{color:var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.group{display:flex;gap:4px;align-items:center;padding:3px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.group>span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 6px}
.group button{border-color:transparent;background:transparent}
.group button:hover{border-color:var(--line);background:var(--soft)}
.guide{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.guide>header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.step{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.step .no{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:12px;background:var(--soft);color:var(--muted);font-family:var(--f-mono)}
.step.done .no{background:var(--ok);color:#fff}
.step.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--panel)}
.step.now .no{background:var(--accent);color:var(--accent-ink)}
.step h3{font-size:14px}
.step p,.step .stxt{margin:0;font-size:12.5px;color:var(--muted)}
.step .stxt ol{margin:4px 0 0;padding-left:18px}
.step .stxt li{margin-bottom:2px}
.step .go{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap}
.welcome{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:center}
@media (max-width:760px){.welcome{grid-template-columns:minmax(0,1fr)}}
.welcome h2{font-size:20px;margin-bottom:6px}
.welcome p{margin:0 0 8px;color:var(--muted);max-width:62ch}
.welcome .illu{max-width:100%}
.welcome .illu svg{width:100%;height:auto;display:block}
.drophint{border:2px dashed var(--line);border-radius:10px;padding:16px;text-align:center;color:var(--muted);margin-top:10px}
.drophint.drop{border-color:var(--accent);color:var(--ink)}
@media (min-width:901px){.layout>aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);max-height:calc(100vh - 20px);overflow:auto}}
.storenote{font-size:12px;color:var(--muted)}
.psugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:8px}
.psucard{border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
.psucard .pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wiz{border-left:4px solid var(--accent)}
.wzsteps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.wzsteps span{font-size:12px;padding:3px 8px;border-radius:12px;background:var(--soft);color:var(--muted)}
.wzsteps span.on{background:var(--accent);color:var(--accent-ink)}
.wzspec{margin:8px 0;padding-left:18px}
.wiz .settings input{width:100%}
.ctx{display:flex;flex-direction:column;gap:6px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:8px 10px;margin-bottom:10px}
.ctxrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ctxrow>label{font-size:12px;font-weight:600;color:var(--ink);min-width:74px}
.ctxhead{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.ctxhead .save{margin-left:auto;text-transform:none;letter-spacing:0}
.report{border-left:4px solid var(--ok)}
.report ul{margin:4px 0 0;padding-left:18px}
.report li{margin-bottom:3px}
.nsopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:8px;margin-top:10px}
.nsopt{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;font-size:13px}
.nsopt.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.nsopt input{margin-top:3px}
.schema{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;align-items:start}
@media (max-width:900px){.schema{grid-template-columns:minmax(0,1fr)}}
.swrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto;min-width:0;max-height:calc(100vh - 120px)}
.swrap svg{display:block;max-width:none}
.sside{display:flex;flex-direction:column;gap:12px;min-width:0}
.sn rect.body{fill:var(--panel);stroke:var(--line);stroke-width:1.2}
.sn.on rect.body{stroke:var(--accent);stroke-width:2}
.sn .head{fill:var(--soft);cursor:grab;touch-action:none}
.sn text{fill:var(--ink);font-family:var(--f-ui);font-size:12px;pointer-events:none}
.sn text.t{font-weight:600;font-size:12.5px}
.sn text.s{fill:var(--muted);font-size:10px;font-family:var(--f-mono)}
.sn text.pl{fill:var(--ink);font-size:11px;pointer-events:auto}
.sp{cursor:pointer}
.sp circle{stroke:var(--panel);stroke-width:1.5}
.sp:hover circle,.sp:focus circle{stroke:var(--ink)}
.sp.pend circle{stroke:var(--accent);stroke-width:3.5}
.sw{fill:none;stroke-width:2.4;cursor:pointer}
.sw:hover{stroke-width:4}
.sw.on{stroke-width:4.5}
.swhit{fill:none;stroke:transparent;stroke-width:12;cursor:pointer}
.slegend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.slegend i{display:inline-block;width:18px;height:0;border-top:3px solid;vertical-align:middle;margin-right:5px}
.ptag{font-size:10px;border:1px solid var(--line);border-radius:3px;padding:0 4px;margin-left:4px;color:var(--muted);white-space:nowrap}
.ptag.warn{color:var(--warn);border-color:var(--warn)}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin-top:8px}
.limask{border-left:4px solid var(--accent)}
.limask .inl input{width:5em}
.pxt th{vertical-align:bottom;white-space:nowrap}
.pxt td.c,.pxt th.c{text-align:center;min-width:84px}
.pxt td.pn{position:sticky;left:0;background:var(--panel);min-width:180px}
.pxt input[type=radio]{width:18px;height:18px;cursor:pointer}
</style>

"use strict";

const languageSelect = document.getElementById("ppLanguage");
const staticLabels = [...document.querySelectorAll("[data-en], [data-en-title]")].map(el => ({
  el, text: el.textContent, title: el.getAttribute("title")
}));
function initialLanguage() {
  if (window.ppDesktop) return new URLSearchParams(window.location.search).get("lang") === "en" ? "en" : "nl";
  try { return localStorage.getItem("pp_language") === "en" ? "en" : "nl"; }
  catch (e) { return "nl"; }
}
let language = initialLanguage();
const tr = (nl, en) => language === "en" ? en : nl;
const uiLocale = () => tr("nl-NL", "en-GB");
const sideLabel = side => ({ alle: tr("alle", "all"), links: tr("links", "left"), midden: tr("midden", "center"), rechts: tr("rechts", "right") })[side] || side;

function applyLanguage() {
  document.documentElement.lang = language;
  languageSelect.value = language;
  for (const { el, text, title } of staticLabels) {
    if (!el.isConnected) continue;
    if (el.dataset.en) el.textContent = tr(text, el.dataset.en);
    if (el.dataset.enTitle) el.title = tr(title, el.dataset.enTitle);
  }
}

languageSelect.addEventListener("change", async () => {
  const next = languageSelect.value;
  languageSelect.disabled = true;
  try {
    if (window.ppDesktop) {
      if (!await window.ppDesktop.setLanguage(next)) throw new Error("Language could not be saved");
      const url = new URL(window.location.href);
      url.searchParams.set("lang", next);
      window.history.replaceState(null, "", url);
    } else {
      localStorage.setItem("pp_language", next);
    }
    language = next;
    applyLanguage();
    buildTypes();
    render();
    window.dispatchEvent(new Event("pp-language-changed"));
  } catch (e) {
    languageSelect.value = language;
    toast(tr("Taal opslaan mislukt.", "Could not save the language."));
  } finally {
    languageSelect.disabled = false;
  }
});
applyLanguage();

    /* Past de naam niet in het deel van de balk, dan komt hij direct eronder op een eigen regel, met een streepje naar zijn deel. */
    const labelsOf = P => { let x = barX; const out = [], lineEnd = [];
      for (const s of P.segs) { const w = s.count / scale * barW, t = asc(`${segLabel(p, s)} ${s.count}`); doc.setFontSize(inFont); const fit = doc.getTextWidth(t) < w - 2;
        if (!fit) { doc.setFontSize(LF); const tw = doc.getTextWidth(t), lx = Math.min(x, barX + barW + 40 - tw); let li = 0; while (lineEnd[li] !== undefined && lx < lineEnd[li] + 1.5) li++; lineEnd[li] = lx + tw; out.push({ s, x, w, t, lx, li }); }
        x += w; }
      return { list: out, lines: lineEnd.length }; };
    for (const P of ports) {
      const ps = bps.find(x => x.from === P.port);
      if (ps) { y = need(y, 6 + rowH); doc.setFont("helvetica", "bold"); doc.setFontSize(8); doc.setTextColor(...C.grey); doc.text(asc(`${ps.name} - ${psuRange(su, ps)}`), M, y + 3.5); doc.setTextColor(...pctCol(ps.pct)); doc.text(asc(`${fmt(ps.w)} / ${ps.watt} W - ${ps.volt} V - ${fmt(ps.a, 1)} A - ${fmt(ps.pct)} %`), W - M, y + 3.5, { align: "right" }); doc.setDrawColor(...C.line); doc.line(M, y + 4.8, W - M, y + 4.8); y += 6; }
      const LB = labelsOf(P), rowHp = rowH + (LB.lines ? LB.lines * LH + 0.8 : 0);
      y = need(y, rowHp);
      doc.setDrawColor(...C.line); doc.setFillColor(248, 250, 249); doc.roundedRect(M, y, W - 2 * M, rowHp - 1, 1, 1, "FD");
      const col = lvlCol(P.lvl), lab = vlabel(su, b.id, P.port);
      doc.setFont("helvetica", "bold"); doc.setFontSize(rowH > 9 ? 10.5 : 9); doc.setTextColor(...(P.n ? col : C.grey)); doc.text(asc(lab), M + 7, y + rowH / 2 + 0.6, { align: "center" });
      // pixelbalk met delen
      const segY = y + 0.9, segH = Math.max(2.4, (rowH - 1) * 0.55);
      doc.setFillColor(...C.soft); doc.rect(barX, segY, barW, segH, "F");
      let x = barX; P.segs.forEach(s => { const w = s.count / scale * barW; doc.setFillColor(...col); doc.setDrawColor(255, 255, 255); doc.rect(x, segY, Math.max(w, .6), segH, "FD"); doc.setTextColor(255, 255, 255); doc.setFont("helvetica", "normal"); doc.setFontSize(segH > 4.5 ? 7.6 : 6.4);
        const t = asc(`${segLabel(p, s)} ${s.count}`); if (!LB.list.some(l => l.s === s)) doc.text(t, x + 1, segY + segH / 2 + 1); x += w; });
      doc.setDrawColor(...C.grey); [st.greenMax, st.orangeMax, st.hardMax].forEach((v, k) => { const lx = barX + v / scale * barW; doc.setLineWidth(k === 2 ? .45 : .2); doc.line(lx, segY - .4, lx, segY + segH + .4); });
      // vermogensbalk
      const wY = segY + segH + 0.8, wH = Math.max(1.2, rowH - 1 - segH - 2.6), pctW = P.wp;
      bar(barX, wY, barW, wH, P.wp / 100, pctCol(pctW)); doc.setDrawColor(...C.grey); doc.setLineWidth(.2); [.8, .9].forEach(f => doc.line(barX + f * barW, wY - .3, barX + f * barW, wY + wH + .3));
      if (LB.lines) { const ly0 = y + rowH - 1 + 0.2; doc.setFont("helvetica", "normal"); doc.setFontSize(LF); doc.setTextColor(...C.ink);
        LB.list.forEach(l => { const by = ly0 + (l.li + 1) * LH - 0.7, cx = l.x + Math.max(l.w, .6) / 2; doc.setDrawColor(...col); doc.setLineWidth(.25); doc.line(cx, segY + segH, cx, by - 2.1); doc.line(cx, by - 2.1, Math.max(cx, l.lx), by - 2.1); doc.text(l.t, l.lx, by); }); }
      // cijfers rechts
      doc.setTextColor(...C.ink); doc.setFont("helvetica", "bold"); doc.setFontSize(8.6);
      doc.text(P.n ? `${P.n} px${P.poolSize > 1 ? ` (pool ${P.poolN})` : ""}` : "leeg", W - M - 2, y + (P.n ? rowH / 2 - .9 : rowH / 2 + .9), { align: "right" });
      if (P.n) { doc.setFont("helvetica", "normal"); doc.setFontSize(7.2); doc.setTextColor(...C.grey); doc.text(`${P.w.toFixed(1)} W - ${P.a.toFixed(2)} A - ${portBright(p, b.id, P.port)} % - ${Math.round(pctW)} % van ${fmt(b.maxA, 1)} A`, W - M - 2, y + rowH / 2 + 2.4, { align: "right" }); }
      y += rowHp;
    }
    doc.setFont("helvetica", "normal"); doc.setFontSize(7); doc.setTextColor(...C.grey);
    y = need(y, 6); doc.text(asc((language === "en" ? `Top bar: pixels per port, with your limits ${st.greenMax} / ${st.orangeMax} / ${st.hardMax}. Names that do not fit are linked to their segment below. Bottom bar: current against a limit of ${fmt(b.maxA, 1)} A per port, with marks at 80% and 90%.` : `Bovenste balk: pixels per poort met jouw grenzen ${st.greenMax} / ${st.orangeMax} / ${st.hardMax}; namen die niet in de balk passen staan eronder, met een streepje naar hun deel. Onderste balk: stroom t.o.v. max ${fmt(b.maxA, 1)} A per poort, streepjes bij 80 en 90 %.`)), M, y + 3); y += 7;
    const body = rows.filter(r => r.boxId === b.id).map(r => [r.port, r.order, r.prop, r.deel, r.px, r.node, r.poortpx, r.br + " %", r.w, r.a, r.note]);
    if (body.length) tbl(need(y, 20), [tr("Poort", "Port"), tr("Volg.", "Order"), "Prop", tr("Deel", "Part"), "Px", tr("Nodes prop", "Prop nodes"), tr("Px op poort", "Px on port"), tr("Helderh.", "Brightness"), "W", "A", tr("Notitie", "Note")], body, { columnStyles: { 2: { cellWidth: 60 }, 10: { cellWidth: 50 } } });
  }

  // ---- 4. Props
  doc.addPage(); y = head("Props", (language === "en" ? `${S.layout.props.length} props from ${S.layout.source}, totaling ${fmt(A.total)} pixels. Ports used in this assignment.` : `${S.layout.props.length} props uit ${S.layout.source}, ${fmt(A.total)} pixels. Waar ze in deze indeling zitten.`));
  const order = { links: 0, midden: 1, rechts: 2 };
  const pr = S.layout.props.slice().sort((a, c) => (order[a.side] - order[c.side]) || a.name.localeCompare(c.name));
  const where = name => p.segs.filter(s => s.prop === name && s.box).map(s => `${shortWhere(su, s)} (${s.count})`).join(", ");
  const profTxt = pw => pw.inc ? (pw.prof === "fixed" ? tr("vast, W ONBEKEND", "fixed power, wattage unknown") : `flood? ${pw.fixed} W ${tr("ONBEVESTIGD", "UNCONFIRMED")}`) : pw.fixed !== undefined ? `${tr("vast", "fixed")} ${pw.fixed} W` : `${pw.type.name}${pw.est ? tr(" (schatting)", " (estimated)") : ""}`;
  tbl(y, ["Prop", tr("Kant", "Zone"), "Pixels", "Strings", tr("Poort(en)", "Port(s)"), "Watt", tr("Vermogen", "Power"), tr("Notitie", "Note")], pr.map(x => { const segs = p.segs.filter(s => s.prop === x.name), w = segs.reduce((a, s) => a + (s.box ? segWatt(p, s) : 0), 0), loose = segs.some(s => !s.box);
    return [x.name, sideLabel(x.side), String(x.px), x.strings.length > 1 ? x.strings.join(" + ") : "1", (where(x.name) || "") + (loose ? (where(x.name) ? tr(" + deel zonder poort", " + unassigned part") : tr("ZONDER POORT", "UNASSIGNED")) : ""), w ? w.toFixed(1) : "", profTxt(propPower(su, x)), p.notes[x.name] || ""]; }),
    { columnStyles: { 0: { cellWidth: 58 }, 4: { cellWidth: 62 }, 6: { cellWidth: 34 }, 7: { cellWidth: 40 } }, didParseCell: d => { if (d.section === "body" && ((d.column.index === 4 && /ZONDER POORT|zonder poort|UNASSIGNED|unassigned part/.test(d.cell.raw)) || (d.column.index === 6 && /ONBE|unknown|unconfirmed/.test(d.cell.raw)))) { d.cell.styles.textColor = C.bad; d.cell.styles.fontStyle = "bold"; } } });

  const n = doc.getNumberOfPages(); for (let i = 1; i <= n; i++) { doc.setPage(i); doc.setFont("helvetica", "normal"); doc.setFontSize(7.5); doc.setTextColor(...C.grey); const PW = doc.internal.pageSize.getWidth(), PH = doc.internal.pageSize.getHeight(); doc.text(asc(`PortPilot - ${p.name} - ${su.name}`), M, PH - 5); doc.text(`${tr("Pagina", "Page")} ${i}/${n}`, PW - M, PH - 5, { align: "right" }); }
  offer(`PortPilot - ${safeName(p.name)}.pdf`, doc.output("arraybuffer"));
};

/* ---------- verse gegevens bij terugkomen in het tabblad */
let lastSync = Date.now();
async function resync() {
  if (Store.mode !== "db" || S.loading || dirty.size || flush.busy || Date.now() - lastSync < 3000) return;
  lastSync = Date.now();
  try {
    const d = await Store.load(); if (!d || dirty.size || flush.busy) return;
    S.layout = d.layout; S.setups = d.setups || {}; S.plans = d.plans || {}; S.types = d.types || []; S.rev = d.rev || {}; if (d.prefs) S.prefs = d.prefs; buildTypes();
    for (const su of Object.values(S.setups)) normalizeSetup(su);
    for (const p of Object.values(S.plans)) normalizePlan(p);
    migrateFixedW();
    render();
  } catch (e) { }
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") resync(); });
window.addEventListener("focus", resync);

/* ================================================================== opstarten */
async function boot() {
  render();
  const timer = setTimeout(() => { if (S.loading) { S.loading = false; S.saveState = tr("Opgeslagen gegevens nog niet bereikbaar", "Saved data is not available yet"); render(); } }, 10000);
  await Store.init();
  let data = null;
  try { data = await Store.load(); } catch (e) { data = Store.readLocal(); Store.mode = "local"; Store.note = tr("Opgeslagen gegevens niet bereikbaar; je werkt in deze browser", "Saved data is unavailable. Changes are kept in this browser."); }
  data = data || { layout: null, setups: {}, plans: {} };
  const isEmpty = d => !d || (!d.layout && !Object.keys(d.setups || {}).length && !Object.keys(d.plans || {}).length);
  if (Store.mode === "db" && isEmpty(data)) { const loc = Store.readLocal(); if (!isEmpty(loc)) { data = loc; if (data.layout) mark("layout"); Object.keys(data.setups || {}).forEach(k => mark("setup-" + k)); Object.keys(data.plans || {}).forEach(k => mark("plan-" + k)); } }
  S.layout = data.layout; S.setups = data.setups || {}; S.plans = data.plans || {}; S.types = data.types || []; S.rev = data.rev || {}; buildTypes();
  if (!Object.keys(S.setups).length && !Object.keys(S.plans).length) {
    const old = await Store.legacy();                     // eerste versie overzetten (eigenaar)
    if (old) {
      if (old.layout) { S.layout = old.layout; mark("layout"); }
      const su = defaultSetup(); S.setups[su.id] = su; mark("setup-" + su.id);
      const latest = old.configs.slice().sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt)))[0];
      if (latest) { const s2 = setupFromV1(latest); Object.assign(su, { volt: s2.volt, mApx: s2.mApx }); su.boxes.forEach(b => { const x = s2.boxes.find(y => y.id === b.id); if (x) Object.assign(b, { up: x.up, side: x.side, maxA: x.maxA }); }); su.psus.forEach(ps => { const x = s2.psus.find(y => y.id === ps.id); if (x) ps.watt = x.watt; }); }
      for (const cfg of old.configs) { const p = planFromV1(cfg, su.id); p.id = cfg.id; S.plans[p.id] = p; mark("plan-" + p.id); }
      toast(tr("Je gegevens uit de vorige versie zijn overgezet", "Your data from the previous version was migrated"));
    }
  }
  for (const su of Object.values(S.setups)) normalizeSetup(su);
  for (const p of Object.values(S.plans)) normalizePlan(p);
  migrateFixedW();
  /* Eigen grens: eenmalig vragen. De eigenaar (maker) houdt zijn bestaande grens uit zijn laatste indeling. */
  S.prefs = data.prefs || null;
  if (!S.prefs) { const last = Object.values(S.plans).sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt)))[0];
    if (Store.isOwner && last) { S.prefs = { set: true, limits: { greenMax: last.settings.greenMax, orangeMax: last.settings.orangeMax, hardMax: last.settings.hardMax }, setAt: new Date().toISOString(), from: "laatste indeling" }; mark("prefs"); }
    else S.prefs = { set: false, limits: { greenMax: 350, orangeMax: 475, hardMax: 500 } }; }
  S.cur = Object.values(S.plans).filter(x => S.setups[x.setupId]).sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt)))[0]?.id || null;
  if (plan()) S.curSetup = plan().setupId; else if (Object.keys(S.setups).length) selectSetup(Object.keys(S.setups)[0]);
  S.loading = false; clearTimeout(timer);
  S.saveState = Store.mode === "db" ? tr("Privé opgeslagen op claude.ai", "Saved privately on claude.ai") : Store.note;
  if (Store.mode !== "db") Store.writeLocal();
  render();
}
boot();
</script>
